[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-doc-mcp"
version = "0.1.0"
description = "MCP Server that reads repositories and generates technical & non-technical documentation"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    # MCP SDK for building the server
    "mcp[cli]>=1.0.0",
    # LLM providers
    "anthropic>=0.39.0",
    "openai>=1.50.0",
    # For local LLM support (Ollama uses OpenAI-compatible API)
    "httpx>=0.27.0",
    # Configuration & Data Models
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pyyaml>=6.0",
    # Token Counting
    "tiktoken>=0.7.0",
    # Output & Display
    "rich>=13.7.0",
    "jinja2>=3.1.0",
    "markdown>=3.5.0",
    # SSL cert handling for corporate environments
    "truststore>=0.9.0",
]

[project.optional-dependencies]
publish = [
    # Google Docs publishing
    "google-api-python-client>=2.100.0",
    "google-auth>=2.23.0",
    "google-auth-httplib2>=0.2.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[project.scripts]
repo-doc-mcp = "src.mcp_server.server:main"
repo-doc-cli = "src.cli:main"
repo-doc-watcher = "src.watcher.cli:main"
repo-doc-mr = "src.mr_docs.cli:main"
repo-doc-publish = "src.publishers.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
