# ============================================================================
# Repo Doc MCP Server — Configuration File
# ============================================================================
#
# Place this file as 'repo-doc-mcp.yaml' in your repo root, or at
# ~/.config/repo-doc-mcp/config.yaml for global settings.
#
# All settings can also be overridden via environment variables with the
# prefix REPO_DOC_ and double underscore for nesting:
#   REPO_DOC_LLM__PROVIDER=openai
#   REPO_DOC_LLM__MODEL=gpt-4o
#   REPO_DOC_LLM__API_KEY=sk-...
# ============================================================================

# ---------------------------------------------------------------------------
# LLM Configuration — which AI model generates the documentation
# ---------------------------------------------------------------------------
llm:
  # Provider: "anthropic" (Claude), "openai" (GPT), "ollama" (local), or "bedrock" (AWS)
  provider: "anthropic"

  # Model name — depends on the provider:
  #   Anthropic: claude-sonnet-4-20250514, claude-opus-4-20250514, claude-haiku-4-5-20251001
  #   OpenAI:    gpt-4o, gpt-4-turbo, gpt-3.5-turbo
  #   Ollama:    llama3.1, codellama, mistral, deepseek-coder, etc.
  #   Bedrock:   arn:aws:bedrock:REGION:ACCOUNT:inference-profile/ID
  model: "claude-sonnet-4-20250514"

  # API key — leave empty to use environment variables:
  #   Anthropic: ANTHROPIC_API_KEY
  #   OpenAI:    OPENAI_API_KEY
  #   Ollama:    not needed
  api_key: null

  # Base URL — only needed for Ollama or custom API endpoints
  #   Ollama default: http://localhost:11434
  base_url: null

  # Maximum tokens in the LLM response (higher = more detailed docs, more cost)
  max_tokens: 8192

  # Temperature: 0.0 = deterministic, 1.0 = creative
  # For documentation, keep this low (0.2-0.4) for consistent, factual output
  temperature: 0.3

# ---------------------------------------------------------------------------
# Repository Scanning — controls how the codebase is read
# ---------------------------------------------------------------------------
repo:
  # Patterns to ignore (works like .gitignore)
  # Add your project-specific ignores here
  ignore_patterns:
    - "node_modules"
    - "__pycache__"
    - ".git"
    - "venv"
    - ".venv"
    - "dist"
    - "build"
    - "*.pyc"
    - "*.jpg"
    - "*.png"
    - "*.gif"
    - "*.svg"
    - "*.zip"
    - "*.tar"
    - "*.gz"
    - ".idea"
    - ".vscode"
    - ".DS_Store"
    - "package-lock.json"
    - "yarn.lock"
    - "pnpm-lock.yaml"
    - "coverage"
    - ".pytest_cache"

  # Files larger than this (in KB) will be truncated during analysis
  max_file_size_kb: 500

  # Maximum number of files to process (safety limit for monorepos)
  max_files: 500

  # Only include files with these extensions (empty = include all)
  # Example: ["py", "ts", "js"] to only document Python and TypeScript
  include_extensions: []

# ---------------------------------------------------------------------------
# Documentation Output — controls the generated documents
# ---------------------------------------------------------------------------
doc:
  # Where to save generated docs (relative to repo root)
  output_dir: "./docs/generated"

  # Output format: "markdown" (default)
  output_format: "markdown"

  # Include a Mermaid architecture diagram in the technical doc
  include_architecture_diagram: true

  # Include a glossary in the non-technical doc
  include_glossary: true

  # How deep to show the directory tree in docs
  tree_depth: 4

# ---------------------------------------------------------------------------
# Publishing — push docs to Confluence and/or Google Docs
# ---------------------------------------------------------------------------
publish:
  # Confluence publishing
  confluence:
    enabled: false
    url: ""                    # e.g., "https://yourcompany.atlassian.net"
    email: ""                  # Your Atlassian account email
    api_token: ""              # API token from id.atlassian.com/manage-profile/security/api-tokens
    space_key: ""              # Space key like "ENG" or "DOCS"
    parent_page_id: null       # Optional: nest docs under a parent page
    update_existing: true      # Update existing pages instead of creating duplicates

  # Google Docs publishing
  google_docs:
    enabled: false
    credentials_file: ""       # Path to service account JSON key file
    folder_id: ""              # Google Drive folder ID
    technical_doc_id: null     # Optional: update a specific doc instead of creating new
    non_technical_doc_id: null

# ---------------------------------------------------------------------------
# Server Settings
# ---------------------------------------------------------------------------
log_level: "INFO"
